<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Lift Log</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--c2:#262a34;--tx:#f2f4f8;--mut:#8b93a3;--acc:#4f8cff;--g:#2ecc71;--r:#ff5c5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
#app{padding:16px 16px 200px;max-width:600px;margin:auto}
h2{margin:8px 0}h3{margin:0 0 6px}small,.mut{color:var(--mut)}
button,select{font:inherit;color:var(--tx);border:0;border-radius:14px;background:var(--c2);min-height:54px;padding:0 18px}
select{width:100%;margin:6px 0}
.pri{background:var(--acc);font-weight:700}.dng{color:var(--r)}.full{width:100%;margin-top:10px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1;min-width:0}
input{width:100%;height:58px;font-size:22px;text-align:center;background:var(--c2);color:var(--tx);border:0;border-radius:12px}
.txt{font-size:18px;text-align:left;padding:0 12px}
.set{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:18px}
.x{min-height:44px;width:44px;padding:0;background:none;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{min-height:40px;padding:0 12px;border-radius:20px;background:var(--c2);display:inline-flex;align-items:center;gap:6px;font-size:15px}
.up{color:var(--g)}.dn{color:var(--r)}
.fl{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.fl button{white-space:nowrap;min-height:46px}
.fl .on,nav .on{background:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0b0d11}
nav button{flex:1;padding:0;font-size:13px;min-height:58px}
#bar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--acc);border-radius:16px;padding:6px 8px 6px 18px;display:flex;justify-content:space-between;align-items:center;font-size:20px}
#bar[hidden]{display:none}#bar button{background:rgba(0,0,0,.25);min-height:46px}
#toast{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:12px 20px;border-radius:24px;font-weight:600;opacity:0;transition:opacity .4s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transition:none}
textarea{width:100%;height:110px;background:var(--c2);color:var(--tx);border:0;border-radius:12px;padding:8px}
.hx{margin-top:10px}
</style></head><body>
<div id="app"></div>
<div id="bar" hidden><span>Set break <b id="tm">0:00</b></span><button data-act="stop">✕</button></div>
<div id="toast"></div>
<nav>
<button data-act="view" data-v="workouts">🏋️<br>Workouts</button>
<button data-act="view" data-v="history">🕘<br>History</button>
<button data-act="view" data-v="progress">📈<br>Progress</button>
<button data-act="view" data-v="settings">⚙️<br>Settings</button>
</nav>
<script>
const $=s=>document.querySelector(s);
let S=null;
try{S=JSON.parse(localStorage.getItem('lift')||'null')}catch(e){}
S=Object.assign({folders:[],workouts:[],sessions:[],unit:'lb',mode:'top',active:null,draft:{}},S||{});
const save=()=>{try{localStorage.setItem('lift',JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0);
const fmt=n=>n==null?'-':String(Math.round(n*10)/10);
let view='workouts',filter='all',sel=null,histOpen=null,pex=null,pm='c',timerStart=null,tt;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1100)}

/* metrics: a = weight (or level), b = reps (or time), c = volume (or distance) */
function metrics(type,sets){
  if(!sets||!sets.length)return null;
  const top=S.mode==='top',avg=x=>sum(x)/x.length;
  if(type==='cardio'){const l=sets.map(s=>s.l);return{a:top?Math.max(...l):avg(l),b:sum(sets.map(s=>s.t)),c:sum(sets.map(s=>s.d))}}
  const w=sets.map(s=>s.w),r=sets.map(s=>s.r);
  return{a:top?Math.max(...w):avg(w),b:top?Math.max(...r):avg(r),c:sum(sets.map(s=>s.w*s.r))};
}
const labels=t=>t==='cardio'?['Level','Time','Dist']:['Weight','Reps','Volume'];
const sfmt=s=>s.w!==undefined?s.w+'×'+s.r:s.t+'min L'+s.l+(s.d?' · '+s.d:'');
function last(exId){for(let i=S.sessions.length-1;i>=0;i--){const e=S.sessions[i].entries.find(x=>x.exId===exId&&x.sets.length);if(e)return e}return null}

function chip(label,cur,prev,toggle){
  let h=label+' <b>'+fmt(cur)+'</b>';
  if(prev>0){const p=(cur-prev)/prev*100;
    if(Math.abs(p)<.5)h+=' <b class="mut">– 0%</b>';
    else h+=' <b class="'+(p>0?'up':'dn')+'">'+(p>0?'▲':'▼')+' '+Math.abs(p).toFixed(0)+'%</b>';}
  return toggle?'<button class="chip" data-act="mode">'+h+'</button>':'<span class="chip">'+h+'</span>';
}
const draftOf=(ent,lt)=>{
  const r=ent.sets[ent.sets.length-1]||(lt&&lt.sets[0])||{};
  const b=ent.type==='cardio'?{t:r.t??'',l:r.l??'',d:r.d??''}:{w:r.w??'',r:r.r??''};
  return Object.assign(b,S.draft[ent.exId]);
};

/* ---------- views ---------- */
function exCard(ent,i){
  const cardio=ent.type==='cardio',lt=last(ent.exId),d=draftOf(ent,lt),L=labels(ent.type);
  const cur=metrics(ent.type,ent.sets),pv=lt&&metrics(ent.type,lt.sets);
  const fld=(f,p,v)=>`<div><small>${p}</small><input type="number" inputmode="decimal" step="any" data-ex="${ent.exId}" data-f="${f}" value="${v}"></div>`;
  return `<div class="card"><h3>${esc(ent.name)}</h3>
  ${lt?`<div class="mut">Last: ${lt.sets.map(sfmt).join(', ')}</div>`:''}
  ${ent.sets.map((s,j)=>`<div class="set"><span>${j+1}. ${sfmt(s)}</span><button class="x" data-act="delset" data-i="${i}" data-j="${j}">✕</button></div>`).join('')}
  ${cur?`<div class="chips">${[0,1,2].map(k=>chip(L[k],cur['abc'[k]],pv&&pv['abc'[k]],k<2)).join('')}</div>`:''}
  <div class="row">${cardio?fld('t','Minutes',d.t)+fld('l','Level',d.l)+fld('d','Distance',d.d):fld('w','Weight ('+S.unit+')',d.w)+fld('r','Reps',d.r)}</div>
  <button class="pri full" data-act="log" data-i="${i}">Log set</button></div>`;
}
function vSess(){
  const a=S.active;if(!a){view='workouts';return vWork()}
  return `<h2>${esc(a.name)}</h2><div class="mut">Tap Weight, Reps or Level chips to switch top set / average.</div>`+
  a.entries.map(exCard).join('')+
  `<button class="pri full" data-act="finish">Finish workout</button><button class="full dng" data-act="cancel">Cancel workout</button>`;
}
function vWork(){
  if(sel){
    const w=S.workouts.find(x=>x.id===sel);if(!w){sel=null;return vWork()}
    return `<button data-act="back">← Back</button><h2>${esc(w.name)}</h2>
    <div class="card"><small>Folder</small><select data-chg="folder"><option value="">Unsorted</option>${S.folders.map(f=>`<option value="${f.id}"${f.id===w.folderId?' selected':''}>${esc(f.name)}</option>`).join('')}</select></div>
    ${w.exercises.map(e=>`<div class="card set"><span>${esc(e.name)} ${e.type==='cardio'?'<small>cardio</small>':''}</span><button class="x" data-act="delex" data-id="${e.id}">✕</button></div>`).join('')}
    <div class="card"><input id="nx" class="txt" placeholder="New exercise name"><select id="nt"><option value="lift">Weights</option><option value="cardio">Cardio</option></select><button class="full" data-act="addex">+ Add exercise</button></div>
    <button class="pri full" data-act="start">Start workout</button><button class="full dng" data-act="delw">Delete workout</button>`;
  }
  const list=S.workouts.filter(w=>filter==='all'||w.folderId===filter);
  const fn=id=>(S.folders.find(f=>f.id===id)||{name:'Unsorted'}).name;
  return `<h2>Workouts</h2>
  <div class="fl"><button class="${filter==='all'?'on':''}" data-act="filter" data-id="all">All</button>${S.folders.map(f=>`<button class="${filter===f.id?'on':''}" data-act="filter" data-id="${f.id}">${esc(f.name)}</button>`).join('')}</div>
  <div class="row"><button data-act="addf">+ Folder</button><button class="pri" data-act="addw">+ Workout</button></div>
  ${filter!=='all'?'<button class="full dng" data-act="delf">Delete this folder</button>':''}
  ${list.length?list.map(w=>`<div class="card" data-act="open" data-id="${w.id}"><h3>${esc(w.name)}</h3><div class="mut">${esc(fn(w.folderId))} · ${w.exercises.length} exercises</div></div>`).join(''):'<p class="mut">No workouts here yet. Tap + Workout.</p>'}`;
}
function vHist(){
  if(!S.sessions.length)return '<h2>History</h2><p class="mut">No workouts logged yet.</p>';
  return '<h2>History</h2>'+[...S.sessions].reverse().map(s=>{
    const vol=sum(s.entries.map(e=>e.type==='cardio'?0:sum(e.sets.map(x=>x.w*x.r))));
    return `<div class="card"><div data-act="hopen" data-id="${s.id}"><b>${esc(s.name)}</b><div class="mut">${new Date(s.date).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${vol?vol+' '+S.unit+' volume':s.entries.length+' exercises'}</div></div>
    ${histOpen===s.id?s.entries.map(e=>`<div class="hx"><b>${esc(e.name)}</b><div>${e.sets.map(sfmt).join(' · ')}</div></div>`).join('')+`<button class="full dng" data-act="delsess" data-id="${s.id}">Delete this workout</button>`:''}</div>`;
  }).join('');
}
function chart(pts){
  if(!pts.length)return '';
  const W=340,H=190,p=34,ys=pts.map(q=>q.y);let lo=Math.min(...ys),hi=Math.max(...ys);if(lo===hi){lo-=1;hi+=1}
  const X=i=>pts.length<2?W/2:p+i*(W-2*p)/(pts.length-1),Y=v=>H-p-(v-lo)/(hi-lo)*(H-2*p);
  const d=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const tx=(x,y,t,a)=>`<text x="${x}" y="${y}" fill="#8b93a3" font-size="11" text-anchor="${a}">${t}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="#4f8cff" stroke-width="3" stroke-linejoin="round" points="${pts.map((q,i)=>X(i)+','+Y(q.y)).join(' ')}"/>
  ${pts.map((q,i)=>`<circle cx="${X(i)}" cy="${Y(q.y)}" r="5" fill="#4f8cff"/>`).join('')}
  ${tx(4,Y(hi)+4,fmt(hi),'start')}${tx(4,Y(lo)+4,fmt(lo),'start')}${tx(p,H-8,d(pts[0].x),'start')}${tx(W-p,H-8,d(pts[pts.length-1].x),'end')}</svg>`;
}
function vProg(){
  const ex={};
  S.workouts.forEach(w=>w.exercises.forEach(e=>ex[e.id]=e));
  S.sessions.forEach(s=>s.entries.forEach(e=>{ex[e.exId]=ex[e.exId]||{id:e.exId,name:e.name,type:e.type}}));
  const list=Object.values(ex).filter(e=>S.sessions.some(s=>s.entries.some(x=>x.exId===e.id)));
  if(!list.length)return '<h2>Progress</h2><p class="mut">Finish a workout to see graphs.</p>';
  if(!list.find(e=>e.id===pex)){pex=list[0].id;pm=list[0].type==='cardio'?'b':'c'}
  const e=ex[pex],tabs=e.type==='cardio'?[['b','Time'],['a','Level'],['c','Distance']]:[['c','Volume'],['a','Weight'],['b','Reps']];
  const pts=S.sessions.filter(s=>s.entries.some(x=>x.exId===pex)).map(s=>({x:s.date,y:metrics(e.type,s.entries.find(x=>x.exId===pex).sets)[pm]}));
  return `<h2>Progress</h2><select data-chg="pex">${list.map(x=>`<option value="${x.id}"${x.id===pex?' selected':''}>${esc(x.name)}</option>`).join('')}</select>
  <div class="fl">${tabs.map(t=>`<button class="${pm===t[0]?'on':''}" data-act="pm" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>
  <div class="card">${chart(pts)}</div><div class="mut">Weight, reps and level use the ${S.mode==='top'?'top set':'average'} of each session.</div>`;
}
function vSet(){
  return `<h2>Settings</h2>
  <button class="full" data-act="unit">Weight unit: ${S.unit} (tap to switch)</button>
  <button class="full" data-act="mode">Compare using: ${S.mode==='top'?'Top set':'Average'} (tap to switch)</button>
  <div class="card"><h3>Backup</h3><textarea id="bk" placeholder="Export fills this box. To restore, paste a backup here and tap Import."></textarea>
  <div class="row"><button data-act="exp">Export</button><button data-act="imp">Import</button></div></div>`;
}
function render(){
  const v={workouts:vWork,session:vSess,history:vHist,progress:vProg,settings:vSet}[view]();
  $('#app').innerHTML=(S.active&&view!=='session'?'<button class="pri full" style="margin:0 0 8px" data-act="view" data-v="session">▶ Workout in progress – resume</button>':'')+v;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(view==='session'?'workouts':view)));
}
function tick(){
  const b=$('#bar');b.hidden=!timerStart;if(!timerStart)return;
  const s=Math.floor((Date.now()-timerStart)/1000);$('#tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
setInterval(tick,500);

/* ---------- actions ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'view':view=t.dataset.v;if(view==='workouts')sel=null;break;
    case 'back':sel=null;break;
    case 'open':sel=id;break;
    case 'filter':filter=id;break;
    case 'addf':{const n=prompt('Folder name (e.g. Push)');if(n&&n.trim()){const f={id:uid(),name:n.trim()};S.folders.push(f);filter=f.id}break}
    case 'delf':if(confirm('Delete this folder? Its workouts will become Unsorted.')){S.workouts.forEach(w=>{if(w.folderId===filter)w.folderId=null});S.folders=S.folders.filter(f=>f.id!==filter);filter='all'}break;
    case 'addw':{const n=prompt('Workout name');if(n&&n.trim()){const w={id:uid(),name:n.trim(),folderId:filter==='all'?null:filter,exercises:[]};S.workouts.push(w);sel=w.id}break}
    case 'addex':{const w=S.workouts.find(x=>x.id===sel),n=$('#nx').value.trim();if(n)w.exercises.push({id:uid(),name:n,type:$('#nt').value});break}
    case 'delex':{const w=S.workouts.find(x=>x.id===sel);w.exercises=w.exercises.filter(e=>e.id!==id);break}
    case 'delw':if(confirm('Delete this workout template? Past history is kept.')){S.workouts=S.workouts.filter(w=>w.id!==sel);sel=null}break;
    case 'start':{const w=S.workouts.find(x=>x.id===sel);if(!w.exercises.length){toast('Add an exercise first');break}
      S.active={name:w.name,entries:w.exercises.map(e=>({exId:e.id,name:e.name,type:e.type,sets:[]}))};S.draft={};view='session';break}
    case 'log':{const ent=S.active.entries[+t.dataset.i],d=draftOf(ent,last(ent.exId));
      if(ent.type==='cardio'){if(!(+d.t>0)){toast('Enter minutes');return}ent.sets.push({t:+d.t,l:+d.l||0,d:+d.d||0})}
      else{if(!(+d.r>0)){toast('Enter reps');return}ent.sets.push({w:+d.w||0,r:+d.r})}
      S.draft[ent.exId]=d;timerStart=Date.now();break}
    case 'delset':S.active.entries[+t.dataset.i].sets.splice(+t.dataset.j,1);break;
    case 'mode':S.mode=S.mode==='top'?'avg':'top';toast('Comparing: '+(S.mode==='top'?'Top set':'Average'));break;
    case 'finish':{const en=S.active.entries.filter(e=>e.sets.length);if(!en.length){toast('Log a set first');return}
      S.sessions.push({id:uid(),name:S.active.name,date:Date.now(),entries:en});S.active=null;S.draft={};timerStart=null;view='history';break}
    case 'cancel':if(confirm('Discard this workout?')){S.active=null;S.draft={};timerStart=null;view='workouts'}break;
    case 'stop':timerStart=null;break;
    case 'hopen':histOpen=histOpen===id?null:id;break;
    case 'delsess':if(confirm('Delete this logged workout?'))S.sessions=S.sessions.filter(s=>s.id!==id);break;
    case 'pm':pm=id;break;
    case 'unit':S.unit=S.unit==='lb'?'kg':'lb';break;
    case 'exp':{const b=$('#bk');b.value=JSON.stringify(S);b.select();try{navigator.clipboard.writeText(b.value)}catch(e){}toast('Backup ready – copy it somewhere safe');return}
    case 'imp':{try{const o=JSON.parse($('#bk').value);if(!o.sessions||!o.workouts)throw 0;if(!confirm('Replace all data with this backup?'))return;S=Object.assign(S,o);toast('Imported')}catch(e){toast('Invalid backup');return}break}
  }
  save();render();tick();
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.chg==='folder'){S.workouts.find(w=>w.id===sel).folderId=t.value||null;save()}
  if(t.dataset.chg==='pex'){pex=t.value;const e=S.sessions.flatMap(s=>s.entries).find(x=>x.exId===pex);pm=e&&e.type==='cardio'?'b':'c';render()}
});
document.addEventListener('input',ev=>{
  const t=ev.target;if(!t.dataset.ex)return;
  (S.draft[t.dataset.ex]=S.draft[t.dataset.ex]||{})[t.dataset.f]=t.value;save();
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();tick();
</script></body></html>
